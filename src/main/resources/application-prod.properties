# Perfil de producción — activar con: SPRING_PROFILES_ACTIVE=prod
# Todas las propiedades sensibles deben venir de variables de entorno.
#
# Variables requeridas en producción:
#   DB_URL                — jdbc:postgresql://host:5432/atara_db
#   DB_USERNAME           — usuario de la base de datos
#   DB_PASSWORD           — contraseña de la base de datos
#   JWT_SECRET            — clave de al menos 64 caracteres aleatorios
#   CORS_ALLOWED_ORIGINS  — dominio(s) del frontend, ej: https://atara.mep.go.cr
#
# Variables opcionales:
#   JWT_EXPIRATION_MS          — duración del access token en ms (default: 86400000 = 1 día)
#   JWT_REFRESH_EXPIRATION_DAYS — duración del refresh token en días (default: 7)

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
